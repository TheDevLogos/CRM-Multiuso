ar(--line);border-radius:16px}.tablewrap table{width:100%;border-collapse:collapse;min-width:760px}.tablewrap th,.tablewrap td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.tablewrap th{background:#f8fbff;color:#475569;text-transform:uppercase;font-size:12px;letter-spacing:.05em}.badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid transparent}.badge.ok{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.badge.warn{background:#fff7ed;color:#b45309;border-color:#fed7aa}.badge.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.task b{display:block;margin-bottom:6px}.task .small{font-size:12px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;min-height:84px}.day .d{font-size:12px;font-weight:800;color:#334155}.day .n{margin-top:8px;font-size:12px;color:#475569}.day.today{outline:2px solid rgba(79,70,229,.16);border-color:#c7d2fe}.drawer-backdrop,.modal-backdrop,.confirm-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.42);display:none;z-index:40}.drawer{position:fixed;top:0;right:0;width:min(560px,100%);height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(15,23,42,.18);transform:translateX(102%);transition:.2s ease;z-index:45;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer .head,.modal .head,.confirm .head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.drawer .body,.modal .body,.confirm .body{padding:18px;overflow:auto;display:grid;gap:14px}.box{border:1px solid var(--line);background:#f8fbff;border-radius:16px;padding:14px}.box h4{margin:0 0 10px;font-size:14px}.box p{m <div class="login" id="loginView"><div class="login-card"><h1>CRM Multi-Negocio</h1><p>Gestión de clientes, agenda, cobros y sincronización con Google Sheets.</p><div class="login-grid"><input id="loginEmail" value="demo@logosdev.com" placeholder="Correo"><input id="loginPass" type="password" value="123456" placeholder="Contraseña"><select id="loginTenant"><option>Médico</option><option>Consultoría</option><option>Despacho</option><option>Inmobiliaria</option><option>Ventas</option><option>Servicios</option></select><button class="btn primary" onclick="login()">Ingresar</button></div></div></div>

ant_id','contact_id','title','status'],payments:['id','tenant_id','contact_id','concept','amount','status']}};
const state={tenant:'Consultoría',page:'Dashboard',user:null,modalEntity:null,editId:null,confirm:null};
const REQUIRED={full_name:'Nombre requerido',name:'Nombre requerido',title:'Título requerido',concept:'Concepto requerido',amount:'Monto requerido',email:'Correo requerido'};
function safeLoad(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){return null}} function safeSave(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store))}catch(e){}}
function uid(){return 'r'+Math.random().toString(36).slice(2,9)+Date.now().toString(36)} function today(){return new Date().toISOString().slice(0,10)} function now(){return new Date().toISOString().slice(0,16).replace('T',' ')}
function seedTenant(tenant){const base={scriptUrl:DEFAULT_SCRIPT_URL,sheetId:DEFAULT_SHEET_ID,sharedToken:'',syncStatus:'Sin configurar',lastSync:'',lastError:'',activity:[{id:uid(),title:'Tenant inicializado',detail:'Estructura base creada',date:now()}],contacts:[],leads:[],appointments:[],meetings:[],hearings:[],visits:[],activities:[],cases:[],documents:[],payments:[],projects:[],opportunities:[],properties:[],pipeline:[],quotes:[],services:[],tickets:[],schedules:[]}; if(tenant==='Médico'){base.contacts=[{id:uid(),tenant_id:'medico',full_name:'María López',phone:'+52 639 100 2001',email:'maria@example.com',type:'Paciente',status:'Activa'}];base.appointments=[{id:uid(),tenant_id:'medico',contact_id:'',title:'Chequeo mensual',start_at:today()+' 09:00',status:'Confirmada'}];base.cases=[{id:uid(),tenant_id:'medico',contact_id:'',clinical_state:'Abierto',owner:'Dr. Pérez'}];base.documents=[{id:uid(),tenant_id:'medico',record_id:'',file_name:'ResultadosLab.pdf',file_type:'PDF'}];base.payments=[{id:uid(),tenant_id:'medico',contact_id:'',concept:'Consulta',amount:'900',status:'Pendiente'}]} if(tenant==='Consultoría'){base.contacts=[{id:uid(),tenant_id:'consultoria',full_name:'Carlos Hernández',company:'Empaques del Norte',phone:'+52 639 100 2002',email:'carlos@example.com',status:'Seguimiento'}];base.projects=[{id:uid(),tenant_id:'consultoria',contact_id:'',name:'Proyecto PYME 2026',stage:'En curso',owner:'Consultor líder'}];base.meetings=[{id:uid(),tenant_id:'consultoria',contact_id:'',title:'Reunión estratégica',date:today()+' 11:00',status:'Pendiente'}];base.opportunities=[{id:uid(),tenant_id:'consultoria',contact_id:'',name:'Rediseño operativo',stage:'Propuesta',probability:'55%',value:'45000'}];base.payments=[{id:uid(),tenant_id:'consultoria',contact_id:'',concept:'Anticipo',amount:'15000',status:'Pendiente'}]} if(tenant==='Despacho'){base.contacts=[{id:uid(),tenant_id:'despacho',full_name:'Laura Gómez',phone:'+52 639 100 2003',email:'laura@example.com',status:'Nue .schedules=[{id:uid(),tenant_id:'servicios',contact_id:'',title:'Servicio programado',date:today()+' 09:30',status:'Confirmada'}];base.services=[{id:uid(),tenant_id:'servicios',name:'Servicio programado',frequency:'Mensual',status:'Activo'}];base.tickets=[{id:uid(),tenant_id:'servicios',contact_id:'',title:'Soporte inicial',status:'Abierto'}];base.payments=[{id:uid(),tenant_id:'servicios',contact_id:'',concept:'Mensualidad',amount:'3000',status:'Pagado'}]} return base}
let store=safeLoad()||Object.fromEntries(Object.keys(NAV).map(t=>[t,seedTenant(t)]));
const el=id=>document.getElementById(id); function data(){return store[state.tenant]} function searchTerm(){const i=el('quickSearch'); return i?i.value.trim().toLowerCase():''}
function addActivity(title,detail){const d=data(); d.activity=(d.activity||[]); d.activity.unshift({id:uid(),title,detail,date:now()}); d.activity=d.activity.slice(0,30); safeSave()}
function login(){state.user={email:el('loginEmail').value||'demo@logosdev.com'}; state.tenant=el('loginTenant').value; state.page='Dashboard'; el('loginView').classList.add('hidden'); el('app').classList.remove('hidden'); el('tenantType').value=state.tenant; render(); toast('Sesión iniciada','Bienvenido al panel de operación')}
function switchTenant(){state.tenant=el('tenantType').value; state.page='Dashboard'; render()}
function navEntity(page){const map={Pacientes:'contacts',Clientes:'contacts',Leads:'leads',Expedientes:'cases',Documentos:'documents',Cobros:'payments',Proyectos:'projects',Oportunidades:'opportunities',Propiedades:'properties',Pipeline:'pipeline',Cotizaciones:'quotes',Servicios:'services',Tickets:'tickets'}; if(page==='Agenda') return state.tenant==='Médico'?'appointments':state.tenant==='Consultoría'?'meetings':state.tenant==='Despacho'?'hearings':state.tenant==='Inmobiliaria'?'visits':state.tenant==='Ventas'?'activities':'schedules'; return map[page]||'contacts'}
function currentEntity(){return navEntity(state.page)} function entityRows(entity=currentEntity()){return data()[entity]||[]} function filterRows(rows){const term=searchTerm(); if(!term) return rows; return rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(term))}
function renderNav(){const nav=el('nav'); nav.innerHTML=''; NAV[state.tenant].forEach(p=>{const b=document.createElement('button'); b.className=p===state.page?'active':''; b.textContent=p; b.onclick=()=>{state.page=p; render()}; nav.appendChild(b)})}

function syncMiniButtons(){return `<button class="btn-mini ghost" onclick="openDrawer('sync')">Estado</button><button class="btn-mini ok" onclick="runPull()">Recibir</button><button class="btn-mini warn" onclick="runPush()">Enviar</button>`}
function render(){if(el('app').classList.contains('hidden')) return; el('tenantLabel').textContent=`${state.tenant} · operación activa`; el('pageTitle').textContent=state.page; el('pageSub').textContent=`${state.tenant} · ${state.page}`; renderNav(); const v=el('view'); v.innerHTML=''; const m=getMetrics(); [['Registros',m.total,'Base operativa'],['Pendientes',m.pending,'Seguimiento'],['Agenda',m.agenda,'Próximos eventos'],['Cobranza',m.revenue,'Monto total']].forEach(k=>v.insertAdjacentHTML('beforeend',`<div class="card kpi"><div class="label">${k[0]}</div><div class="value">${k[1]}</div><div class="hint">${k[2]}</div></div>`)); if(state.page==='Dashboard') v.insertAdjacentHTML('beforeend',dashboardView()); else if(['Pacientes','Clientes','Leads'].includes(state.page)) v.insertAdjacentHTML('beforeend',tableView(currentEntity(),state.page,'Relación principal')); else if(state.page==='Agenda') v.insertAdjacentHTML('beforeend',agendaView()); else v.insertAdjacentHTML('beforeend',tableView(currentEntity(),state.page,'Gestión operativa'))}
function getMetrics(){const d=data(); const all=Object.values(d).filter(Array.isArray).flat(); const total=all.length; const agenda=(entityRows(navEntity('Agenda'))||[]).length; const pending=all.filter(x=>String(x.status||x.stage||'').match(/pend|nuevo|propuesta|negociación|abierto|seguimiento/i)).length; const revenue=(d.payments||[]).reduce((a,b)=>a+(parseFloat(b.amount)||0),0).toLocaleString('es-MX'); return {total,pending,agenda,revenue}}
function dashboardView(){const d=data(); return `<div class="card half">${screenHeader('Resumen operativo','Indicadores y seguimiento',`<button class="btn-mini primary" onclick="openCreateForPage()">Nuevo</button>`)}<div class="state-line"><span>Estado:</span><span class="badge info">${d.syncStatus||'Sin configurar'}</span><span>Última sincronización: ${d.lastSync||'Sin registro'}</span></div><div style="height:12px"></div><div class="tablewrap"><table><thead><tr><th>Área</th><th>Volumen</th><th>Lectura</th></tr></thead><tbody><tr><td>Base principal</td><td>${entityRows(currentEntity()).length}</td><td>Registros del módulo activo</td></tr><tr><td>Pagos</td><td>${(d.payments||[]).length}</td><td>Seguimiento de cobranza</td></tr><tr><td>Agenda</td><td>${entityRows(navEntity('Agenda')).length}</td><td>Eventos próximos</td></tr></tbody></table></div></div><div class="card half">${screenHeader('Calendario','Vista rápida de 14 días',`<button class="btn-mini primary" onclick="openEntityModal('${navEntity('Agenda')}')">Agregar evento</button>`)}<div class="calendar">${calendarMarkup()}</div></div><div class="card half">${screenHeader('Actividad reciente','Trazabilidad básica del CRM')}<div class="activity-list">${(d.activity||[]).slice(0,6).map(a=>`<div class="activity"><b>${a.title}</b><div class="small">${a.detail}</div><div class="small">${a.date}</div></div>`).join('')}</div></div><div class="card half">${screenHeader('Sincronización','Resumen técnico sin exponer controles invasivos')}<div class="tablewrap"><table><thead><tr><th>Parámetro</th><th>Valor</th></tr></thead><tbody><tr><td>Web App</td><td>${d.scriptUrl||DEFAULT_SCRIPT_URL}</td></tr><tr><td>Sheet ID</td><td>${d.sheetId||DEFAULT_SHEET_ID}</td></tr><tr><td>Token</td><td>${d.sharedToken||'Vacío'}</td></tr><tr><td>Error reciente</td><td>${d.lastError||'Sin errores'}</td></tr></tbody></table></div></div>`}
function calendarMarkup(){const agenda=entityRows(navEntity('Agenda')); let out=''; for(let i=0;i<14;i++){const dt=new Date(Date.now()+i*86400000); const iso=dt.toISOString().slice(0,10); const item=agenda.find(x=>String(x.date||x.start_at||'').startsWith(iso)); out += `<div class="day ${i===0?'today':''}"><div class="d">${dt.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}</div><div class="n">${item?(item.title||item.name):'Sin evento'}</div></div>`} return out}
function columnsForEntity(entity){const schema=(SCHEMAS[state.tenant]||{})[entity]||[]; return schema.filter(c=>c!=='tenant_id')}
function labelize(x){return x.replaceAll('_',' ').replace(/\b\w/g,m=>m.toUpperCase())}
function tableView(entity,title,subtitle){const cols=columnsForEntity(entity); const rows=filterRows(entityRows(entity)); return `<div class="card panel">${screenHeader(title,subtitle,`<button class="btn-mini primary" onclick="openEntityModal('${entity}')">Nuevo</button>`)}<div class="tablewrap"><table><thead><tr>${cols.slice(0,6).map(c=>`<th>${labelize(c)}</th>`).join('')}<th>Acciones</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.slice(0,6).map(c=>`<td>${r[c]??''}</td>`).join('')}<td><div class="toolbar"><button class="btn-mini ghost" onclick="openEntityModal('${entity}','${r.id}')">Editar</button><button class="btn-mini ghost" onclick="askDelete('${entity}','${r.id}')">Eliminar</button></div></td></tr>`).join('')||`<tr><td colspan="7">Sin registros</td></tr>`}</tbody></table></div></div>`}
function agendaView(){const entity=navEntity('Agenda'); const rows=filterRows(entityRows(entity)); return `<div class="card panel">${screenHeader('Agenda','Gestión de citas, reuniones, audiencias o actividades',`<button class="btn-mini primary" onclick="openEntityModal('${entity}')">Nuevo evento</button>`)}<div class="tablewrap"><table><thead><tr><th>Título</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.title||r.name||''}</td><td>${r.date||r.start_at||''}</td><td><span class="badge ${String(r.status||'').match(/confirm|pagad|activo/i)?'ok':'warn'}">${r.status||''}</span></td><td><div class="toolbar"><button class="btn-mini ghost" onclick="openEntityModal('${entity}','${r.id}')">Editar</button><button class="btn-mini ghost" onclick="askDelete('${entity}','${r.id}')">Eliminar</button></div></td></tr>`).join('')||`<tr><td colspan="4">Sin eventos</td></tr>`}</tbody></table></div></div>`}
function openCreateForPage(){openEntityModal(currentEntity())}
function fieldType(name){if(/amount|price|value/.test(name)) return 'number'; if(/email/.test(name)) return 'email'; if(/date|start_at/.test(name)) return 'datetime-local'; return 'text'}
function statusField(c,val){const options=c==='status'?['Nuevo','Activa','Activo','Pendiente','Confirmada','Pagado','Borrador','Abierto','Seguimiento','Disponible']:c==='stage'?['Prospección','Propuesta','En curso','Negociación','Cerrado']:c==='type'?['Paciente','Cliente','Lead']:c==='file_type'?['PDF','DOCX','XLSX','IMG']:['Semanal','Mensual','Trimestral']; return `<select data-field="${c}">${options.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`}
function openEntityModal(entity,id=''){state.modalEntity=entity; state.editId=id||null; const cols=columnsForEntity(entity); const record=id?entityRows(entity).find(x=>x.id===id)||{}:{}; el('modalTitle').textContent=id?`Editar ${labelize(entity)}`:`Nuevo ${labelize(entity)}`; const form=el('modalForm'); form.innerHTML=''; cols.forEach(c=>{if(c==='id')return; const val=record[c]||''; form.insertAdjacentHTML('beforeend',`<div class="field ${/name|title|concept|full_name/.test(c)?'full':''}" data-wrap="${c}"><label>${labelize(c)}</label>${c==='status'||c==='stage'||c==='type'||c==='file_type'||c==='frequency'?statusField(c,val):`<input data-field="${c}" type="${fieldType(c)}" value="${String(val).replaceAll('"','&quot;')}">`}<div class="error-text hidden" data-error="${c}"></div></div>`)}); form.insertAdjacentHTML('beforeend',`<div class="field full footer-actions"><button type="button" class="btn" onclick="hideModal()">Cancelar</button><button type="button" class="btn primary" onclick="saveEntity()">Guardar</button></div>`); el('modalBackdrop').style.display='flex'}
function validateForm(){let ok=true; [...el('modalForm').querySelectorAll('[data-wrap]')].forEach(w=>{w.classList.remove('invalid'); const field=w.getAttribute('data-wrap'); const input=w.querySelector('[data-field]'); const err=w.querySelector('[data-error]'); const val=(input?.value||'').trim(); err.textContent=''; err.classList.add('hidden'); if(REQUIRED[field] && !val){ok=false; w.classList.add('invalid'); err.textContent=REQUIRED[field]; err.classList.remove('hidden')} if(field==='email' && val && !/^\S+@\S+\.\S+$/.test(val)){ok=false; w.classList.add('invalid'); err.textContent='Correo inválido'; err.classList.remove('hidden')} if(/amount|price|value/.test(field) && val && Number(val)<0){ok=false; w.classList.add('invalid'); err.textContent='Valor inválido'; err.classList.remove('hidden')}}); return ok}
function hideModal(){el('modalBackdrop').style.display='none'} function closeModal(e){if(e.target===el('modalBackdrop')) hideModal()}
function saveEntity(){if(!validateForm()) return toast('Validación','Corrige los campos marcados'); const entity=state.modalEntity; const list=data()[entity]||(data()[entity]=[]); const payload={id:state.editId||uid(),tenant_id:state.tenant.toLowerCase()}; [...el('modalForm').querySelectorAll('[data-field]')].forEach(i=>payload[i.dataset.field]=i.value); if(state.editId){const idx=list.findIndex(x=>x.id===state.editId); if(idx>=0) list[idx]={...list[idx],...payload}; addActivity('Registro actualizado',`${labelize(entity)} modificado correctamente`)} else {list.unshift(payload); addActivity('Registro creado',`${labelize(entity)} agregado al sistema`)} safeSave(); render(); hideModal(); toast('Registro guardado','La información fue actualizada correctamente')}
function askDelete(entity,id){state.confirm={entity,id}; el('confirmText').textContent='Esta acción eliminará el registro seleccionado y no se puede deshacer.'; el('confirmAction').onclick=()=>confirmDelete(); el('confirmBackdrop').style.display='flex'}
function confirmDelete(){const {entity,id}=state.confirm||{}; const list=data()[entity]||[]; const idx=list.findIndex(x=>x.id===id); if(idx>=0){list.splice(idx,1); addActivity('Registro eliminado',`${labelize(entity)} retirado del sistema`); safeSave(); render(); toast('Registro eliminado','El elemento fue retirado del módulo')} hideConfirm()}
function hideConfirm(){el('confirmBackdrop').style.display='none'; state.confirm=null} function closeConfirm(e){if(e.target===el('confirmBackdrop')) hideConfirm()}
function openDrawer(type){const d=data(); el('drawerBackdrop').style.display='block'; el('drawer').classList.add('open'); if(type==='settings'){el('drawerTitle').textContent='Configuración'; el('drawerSub').textContent='Parámetros generales y conexión'; el('drawerBody').innerHTML=`<div class="box"><h4>Conexión</h4><div class="form-grid"><div class="field full"><label>Web App URL</label><input id="cfgUrl" value="${d.scriptUrl||DEFAULT_SCRIPT_URL}"></div><div class="field"><label>Sheet ID</label><input id="cfgSheet" value="${d.sheetId||DEFAULT_SHEET_ID}"></div><div class="field"><label>Token</label><input id="cfgToken" value="${d.sharedToken||''}"></div></div><div class="footer-actions"><button class="btn primary" onclick="saveConfig()">Guardar cambios</button></div></div><div class="box"><h4>Validación estructural</h4><p>Esta versión usa un schema fijo por tenant para que Push y Pull trabajen con las mismas columnas esperadas en Google Sheets y Apps Script.</p></div>`} if(type==='sync'){el('drawerTitle').textContent='Sincronización'; el('drawerSub').textContent='Operación discreta y validación'; el('drawerBody').innerHTML=`<div class="box"><h4>Estado</h4><p>${d.syncStatus||'Sin configurar'}</p><p style="margin-top:8px">Última sincronización: ${d.lastSync||'Sin registro'}</p><p style="margin-top:8px">Error reciente: ${d.lastError||'Sin errores'}</p></div><div class="box"><h4>Acciones</h4><div class="toolbar"><button class="btn-mini ghost" onclick="runHealthCheck()">Salud</button><button class="btn-mini warn" onclick="runPush()">Enviar</button><button class="btn-mini ok" onclick="runPull()">Recibir</button><button class="btn-mini primary" onclick="runSync()">Sincronizar</button></div></div><div class="box"><h4>Estructura esperada</h4>${Object.entries(SCHEMAS[state.tenant]).map(([k,v])=>`<div class="activity"><b>${k}</b><div class="small">${v.join(', ')}</div></div>`).join('')}</div>`}}
function hideDrawer(){el('drawer').classList.remove('open'); el('drawerBackdrop').style.display='none'} function closeDrawer(e){if(e.target===el('drawerBackdrop')) hideDrawer()}
function saveConfig(){const d=data(); d.scriptUrl=el('cfgUrl').value.trim()||DEFAULT_SCRIPT_URL; d.sheetId=el('cfgSheet').value.trim()||DEFAULT_SHEET_ID; d.sharedToken=el('cfgToken').value.trim(); d.syncStatus='Configuración actualizada'; addActivity('Configuración actualizada','Se guardaron los parámetros de sincronización'); safeSave(); render(); toast('Configuración','Parámetros guardados')}
function sheetPayload(){const d=data(); const schema=SCHEMAS[state.tenant]||{}; const rows={}; Object.entries(schema).forEach(([entity,cols])=>{const list=(d[entity]||[]).map(r=>cols.map(c=>r[c]??'')); rows[entity]=[cols,...list]}); return rows}
function hydrateFromPull(payload){if(!payload||!payload.rows) return; const d=data(); Object.entries(payload.rows).forEach(([entity,matrix])=>{if(!Array.isArray(matrix)||!matrix.length) return; const headers=matrix[0]; d[entity]=matrix.slice(1).filter(r=>r.some(x=>String(x||'').trim()!=='')).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))}); d.syncStatus='Datos actualizados'; d.lastSync=now(); d.lastError=''; addActivity('Sincronización recibida','Se actualizó la información desde Google Sheets'); safeSave(); render()}
function runHealthCheck(){const d=data(); const url=(d.scriptUrl||DEFAULT_SCRIPT_URL).trim(); fetch(`${url}?action=health`).then(r=>r.json()).then(j=>{d.syncStatus=j.ok?'Conexión verificada':'Error de conexión'; d.lastSync=now(); d.lastError=j.ok?'':(j.error||'Respuesta inválida'); addActivity('Validación de conexión',d.syncStatus); safeSave(); render(); toast('Validación',j.ok?'La Web App respondió correctamente':'Respuesta no válida')}).catch(err=>{d.lastError=String(err.message||err); safeSave(); toast('Validación','No fue posible validar la conexión')})}
function runPush(){const d=data(); const url=(d.scriptUrl||DEFAULT_SCRIPT_URL).trim(); const payload={action:'push',tenant:state.tenant,token:d.sharedToken||'',rows:sheetPayload()}; fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}).then(()=>{d.syncStatus='Envío realizado'; d.lastSync=now(); d.lastError=''; addActivity('Sincronización enviada','Se envió la información hacia Google Sheets'); safeSave(); render(); toast('Sincronización','Solicitud enviada. Usa Recibir para confirmar cambios')}).catch(err=>{d.lastError=String(err.message||err); safeSave(); toast('Sincronización','No fue posible enviar la solicitud')})}
function runPull(){const d=data(); const url=(d.scriptUrl||DEFAULT_SCRIPT_URL).trim(); fetch(`${url}?action=pull&tenant=${encodeURIComponent(state.tenant)}&token=${encodeURIComponent(d.sharedToken||'')}`).then(r=>r.json()).then(j=>{if(j&&j.ok!==false){hydrateFromPull(j); toast('Sincronización','Datos recibidos correctamente')} else {throw new Error(j.error||'Respuesta inválida')}}).catch(err=>{d.lastError=String(err.message||err); safeSave(); toast('Sincronización','No fue posible recuperar información')})}
function runSync(){runPush(); setTimeout(runPull,1000)}
function toast(title,message){const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<b>${title}</b><span>${message}</span>`; el('toasts').appendChild(t); setTimeout(()=>t.remove(),3200)}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){hideDrawer(); hideModal(); hideConfirm()}})
</script>
</body>
</html>
