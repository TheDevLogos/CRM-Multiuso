<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />

<title>CRM Multi-Negocio v10</title>
<style>
:root{--bg:#eef3fb;--panel:#fff;--text:#0f172a;--muted:#64748b;--line:#dbe3ef;--pri:#4f46e5;--pri2:#7c3aed;--ok:#059669;--warn:#d97706;--danger:#dc2626;--soft:#f5f7ff;--shadow:0 18px 50px rgba(15,23,42,.08);--r:22px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#f8fbff 0,#eef3fb 45%,#e7edf8 100%);color:var(--text);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit} .hidden{display:none !important}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh;overflow:hidden}
.side{background:linear-gradient(180deg,#0f172a 0,#111827 100%);color:#e2e8f0;padding:20px 16px;display:flex;flex-direction:column;gap:14px;border-right:1px solid rgba(255,255,255,.06)}
.brand{padding:8px 8px 14px;border-bottom:1px solid rgba(255,255,255,.08)}.brand h1{margin:0;font-size:20px;line-height:1.1}.brand p{margin:7px 0 0;font-size:12px;color:#94a3b8}
.side label{display:block;font-size:12px;color:#94a3b8;margin:0 0 6px}.side select,.side input,.side textarea{width:100%;padding:12px 12px;border-radius:14px;border:1px solid rgba(148,163,184,.22);background:#0b1220;color:#e5e7eb}
.nav{display:grid;gap:8px;overflow:auto;padding-right:4px}.nav button{width:100%;border:1px solid rgba(148,163,184,.14);background:#111827;color:#cbd5e1;padding:12px 14px;border-radius:14px;text-align:left;cursor:pointer;font-weight:700;transition:.15s}.nav button:hover{transform:translateY(-1px);background:#162032}.nav button.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(79,70,229,.35)}
.foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#94a3b8}
.main{display:grid;grid-template-rows:auto 1fr;min-width:0}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}.top h2{margin:0;font-size:20px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}.btn{border:0;border-radius:14px;padding:11px 14px;cursor:pointer;font-weight:800;transition:.15s}.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 12px 26px rgba(79,70,229,.28)}.btn.light{background:#fff;color:#0f172a;border:1px solid var(--line)}
.content{padding:18px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}.kpi{grid-column:span 3;display:flex;flex-direction:column;gap:8px;min-height:128px}.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.kpi .value{font-size:30px;font-weight:900;letter-spacing:-.04em}.kpi .hint{font-size:13px;color:#475569}
.panel{grid-column:span 12}.half{grid-column:span 6}.third{grid-column:span 4}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-head h3{margin:0;font-size:16px}.section-head .meta{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--soft);color:#3730a3;border:1px solid #dbe3ff;padding:8px 10px;border-radius:999px;font-size:12px;font-weight:700}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:12px;color:#475569;text-transform:uppercase;letter-spacing:.06em;background:#f8fbff}tr:hover td{background:#fbfdff}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid transparent;white-space:nowrap}.ok{background:#ecfdf5;color:#047857;border-color:#bbf7d0}.warn{background:#fffbeb;color:#b45309;border-color:#fde68a}.info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#f8fbff;border:1px solid var(--line);border-radius:18px;padding:12px;min-height:220px}.col h4{margin:2px 0 12px;font-size:14px}.task{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 8px 18px rgba(15,23,42,.04)}.task b{display:block;font-size:13px;margin-bottom:6px}.task .small{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px}.drawer-backdrop,.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}.drawer{position:fixed;top:0;right:0;height:100%;width:min(760px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(15,23,42,.22);transform:translateX(102%);transition:.22s ease;z-index:45;display:flex;flex-direction:column}.drawer.open{transform:translateX(0)}.drawer .head,.modal .head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.drawer .body{padding:18px;overflow:auto;display:grid;gap:12px}.drawer .box{background:#f8fbff;border:1px solid var(--line);border-radius:18px;padding:14px}.drawer h3,.modal h3{margin:0;font-size:16px}.drawer h4{margin:0 0 8px;font-size:13px}.drawer p{margin:0;color:#334155;font-size:13px}
.modal{width:min(1120px,100%);background:#fff;border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.25);border:1px solid var(--line);overflow:hidden}.modal .body{padding:18px;display:grid;gap:14px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid .full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#475569;font-weight:800;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border-radius:14px;border:1px solid var(--line);outline:none;background:#fff;font:inherit}.field textarea{min-height:120px;resize:vertical}.footer-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:4px}
.toast-stack{position:fixed;right:18px;bottom:18px;display:grid;gap:10px;z-index:60}.toast{min-width:280px;max-width:400px;background:#0f172a;color:#fff;border-radius:16px;padding:13px 14px;box-shadow:0 18px 40px rgba(15,23,42,.32)}.toast b{display:block;margin-bottom:4px;font-size:13px}.toast span{font-size:12px;color:#cbd5e1}
.login{position:fixed;inset:0;background:radial-gradient(circle at top,#1e293b 0,#0f172a 60%,#020617 100%);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}.login-card{width:min(700px,100%);background:#fff;border-radius:28px;padding:26px;box-shadow:0 35px 120px rgba(0,0,0,.35)}.login-card h1{margin:0;font-size:24px}.login-card p{margin:8px 0 18px;color:#475569}.login-grid{display:grid;gap:12px}.login-grid input,.login-grid select,.login-grid textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);font:inherit}
.hidden{display:none !important}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:82px}.day .d{font-size:12px;font-weight:800;color:#334155}.day .n{margin-top:8px;font-size:12px;color:#475569}.day.today{border-color:var(--pri);box-shadow:0 0 0 2px rgba(79,70,229,.12)}
.code{background:#0b1220;color:#dbeafe;border-radius:16px;padding:14px;overflow:auto;font-size:12px;line-height:1.5;white-space:pre-wrap}
@media (max-width:1180px){.app{grid-template-columns:1fr}.side{display:none}.kpi,.half,.third{grid-column:span 12}.kanban{grid-template-columns:1fr 1fr}}
@media (max-width:760px){body{font-size:14px}.top{padding:14px}.content{padding:14px}.actions{justify-content:flex-start}.kanban{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.modal{border-radius:18px}.calendar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="login" id="loginView"><div class="login-card"><h1>CRM Multi-Negocio v10</h1><p>Conexión frontend lista para Apps Script. Solo pega la URL de tu Web App, el Sheet ID y el token opcional.</p><div class="login-grid"><input id="loginEmail" value="demo@logosdev.com" placeholder="Correo" /><input id="loginPass" type="password" value="123456" placeholder="Contraseña" /><select id="loginType"><option>Médico</option><option>Consultoría</option><option>Despacho</option><option>Inmobiliaria</option><option>Ventas</option><option>Servicios</option></select><button class="btn primary" onclick="login()">Entrar al CRM</button></div></div></div>
<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><h1>CRM Multi-Negocio</h1><p id="tenantLabel">Modo: Médico</p></div>
    <div><label>Tipo de CRM</label><select id="tenantType" onchange="switchTenant()"><option>Médico</option><option>Consultoría</option><option>Despacho</option><option>Inmobiliaria</option><option>Ventas</option><option>Servicios</option></select></div>
    <div><label>Búsqueda rápida</label><input id="quickSearch" placeholder="Buscar..." oninput="render()" /></div>
    <div class="nav" id="nav"></div>

  </aside>
  <main class="main">
    <div class="top"><div class="title"><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Resumen ejecutivo</p></div><div class="actions"><button class="btn light" onclick="openModal('contact')">+ Registro</button><button class="btn light" onclick="openModal('appointment')">+ Evento</button><button class="btn light" onclick="openModal('opportunity')">+ Oportunidad</button><button class="btn primary" onclick="openDrawer('setup')">Setup Apps Script</button></div></div>
    <div class="content"><div class="grid" id="view"></div></div>
  </main>
</div>
<div class="drawer-backdrop" id="drawerBackdrop" onclick="closeDrawer(event)"></div>
<aside class="drawer" id="drawer"><div class="head"><div><h3 id="drawerTitle">Panel</h3><div class="muted" id="drawerSub">Detalle</div></div><button class="btn light" onclick="hideDrawer()">Cerrar</button></div><div class="body" id="drawerBody"></div></aside>
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)"><div class="modal"><div class="head"><h3 id="modalTitle">Nuevo</h3><button class="btn light" onclick="hideModal()">Cerrar</button></div><div class="body"><form id="modalForm" class="form-grid"></form></div></div></div>
<div class="toast-stack" id="toasts"></div>
<script>
const BASE={'Médico':['Dashboard','Pacientes','Citas','Expedientes','Documentos','Cobros','Reportes','Automatizaciones'],'Consultoría':['Dashboard','Clientes','Proyectos','Reuniones','Entregables','Cobros','Reportes','Automatizaciones'],'Despacho':['Dashboard','Casos','Expedientes','Agenda','Documentos','Honorarios','Reportes','Automatizaciones'],'Inmobiliaria':['Dashboard','Leads','Propiedades','Visitas','Oportunidades','Cobros','Reportes','Automatizaciones'],'Ventas':['Dashboard','Leads','Pipeline','Cotizaciones','Cobros','Reportes','Automatizaciones'],'Servicios':['Dashboard','Clientes','Servicios','Agenda','Cobros','Reportes','Automatizaciones']};
const SCHEMAS={'Médico':{contacts:['id','tenant_id','full_name','phone','email','type','status'],appointments:['id','tenant_id','contact_id','title','start_at','status'],cases:['id','tenant_id','contact_id','clinical_state','owner'],documents:['id','tenant_id','record_id','file_name','file_type'],payments:['id','tenant_id','contact_id','concept','amount','status']},'Consultoría':{contacts:['id','tenant_id','full_name','company','phone','email','status'],projects:['id','tenant_id','contact_id','name','stage','owner'],meetings:['id','tenant_id','contact_id','title','date','status'],deliverables:['id','tenant_id','project_id','name','status'],payments:['id','tenant_id','contact_id','concept','amount','status'],opportunities:['id','tenant_id','contact_id','name','stage','probability']},'Despacho':{contacts:['id','tenant_id','full_name','phone','email','status'],cases:['id','tenant_id','contact_id','case_number','state','owner'],hearings:['id','tenant_id','case_id','title','date','status'],documents:['id','tenant_id','record_id','file_name','file_type'],payments:['id','tenant_id','contact_id','concept','amount','status'],tasks:['id','tenant_id','case_id','title','status']},'Inmobiliaria':{leads:['id','tenant_id','full_name','phone','email','status'],properties:['id','tenant_id','name','location','price','status'],visits:['id','tenant_id','property_id','title','date','status'],offers:['id','tenant_id','property_id','offer_value','status'],payments:['id','tenant_id','contact_id','concept','amount','status'],opportunities:['id','tenant_id','contact_id','name','stage','probability']},'Ventas':{leads:['id','tenant_id','full_name','phone','email','status'],pipeline:['id','tenant_id','lead_id','stage','value','probability'],quotes:['id','tenant_id','lead_id','title','amount','status'],payments:['id','tenant_id','lead_id','concept','amount','status'],activities:['id','tenant_id','lead_id','type','date','status']},'Servicios':{contacts:['id','tenant_id','full_name','phone','email','status'],services:['id','tenant_id','name','frequency','status'],schedules:['id','tenant_id','contact_id','title','date','status'],documents:['id','tenant_id','record_id','file_name','file_type'],payments:['id','tenant_id','contact_id','concept','amount','status'],tickets:['id','tenant_id','contact_id','title','status']}};
const state={tenant:'Médico',page:'Dashboard',user:null}; const STORAGE_KEY='crm_v10_store';
const DEFAULT_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxxVbOtt9GJrf14QaFzhHQaTVLLznnEOZ2P9d1vT-F-ptXMk4hRsJ3HuAkxLcKfdrrYGw/exec';
let store=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||Object.fromEntries(Object.keys(BASE).map(t=>[t,seedTenant(t)])); function saveStore(){localStorage.setItem(STORAGE_KEY,JSON.stringify(store))}
function uid(){return 'r'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)} function now(){return new Date().toISOString().slice(0,16).replace('T',' ')} function dstr(x){return x.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}
function seedTenant(t){const base={logs:[{id:uid(),type:'create',entity:'system',label:'Tenant inicializado',date:now()}],events:[{id:uid(),title:'Revisión semanal',date:new Date().toISOString().slice(0,10),status:'Hoy'},{id:uid(),title:'Seguimiento clave',date:new Date(Date.now()+86400000).toISOString().slice(0,10),status:'Semana'},{id:uid(),title:'Cierre mensual',date:new Date(Date.now()+7*86400000).toISOString().slice(0,10),status:'Mes'}],setupDone:false,scriptUrl:DEFAULT_SCRIPT_URL,sheetId:'',sharedToken:'',syncStatus:'Sin configurar'}; if(t==='Médico') return {...base,contacts:[{id:uid(),full_name:'María López',phone:'+52 639 100 2001',email:'maria@example.com',type:'Paciente',status:'Activa'}],appointments:[{id:uid(),contact_id:'',title:'Chequeo Mensual',start_at:new Date().toISOString().slice(0,10)+' 09:00',status:'Confirmada'}],cases:[{id:uid(),contact_id:'',clinical_state:'Abierto',owner:'Dr. Pérez'}],documents:[{id:uid(),record_id:'',file_name:'ResultadosLab.pdf',file_type:'PDF'}],payments:[{id:uid(),contact_id:'',concept:'Consulta',amount:'900',status:'Pendiente'}],opportunities:[]}; if(t==='Consultoría') return {...base,contacts:[{id:uid(),full_name:'Carlos Hernández',phone:'+52 639 100 2002',email:'carlos@example.com',company:'Empaques del Norte',status:'Seguimiento'}],projects:[{id:uid(),contact_id:'',name:'Proyecto PYME 2026',stage:'En curso',owner:'Consultor líder'}],meetings:[{id:uid(),contact_id:'',title:'Reunión estrategia',date:new Date().toISOString().slice(0,10)+' 11:00',status:'Pendiente'}],deliverables:[{id:uid(),project_id:'',name:'Diagnóstico operativo',status:'Borrador'}],payments:[{id:uid(),contact_id:'',concept:'Anticipo consultoría',amount:'15000',status:'Pendiente'}],opportunities:[{id:uid(),contact_id:'',name:'Rediseño operativo',stage:'Propuesta',probability:'55%',value:'45000'}]}; if(t==='Despacho') return {...base,contacts:[{id:uid(),full_name:'Laura Gómez',phone:'+52 639 100 2003',email:'laura@example.com',status:'Nuevo'}],cases:[{id:uid(),contact_id:'',case_number:'Fiscal 2026',state:'Abierto',owner:'Lic. Ruiz'}],hearings:[{id:uid(),case_id:'',title:'Audiencia',date:new Date().toISOString().slice(0,10)+' 08:00',status:'Confirmada'}],documents:[{id:uid(),record_id:'',file_name:'EscritoInicial.docx',file_type:'DOCX'}],payments:[{id:uid(),contact_id:'',concept:'Honorarios iniciales',amount:'9500',status:'Pagado'}],tasks:[{id:uid(),case_id:'',title:'Revisar pruebas',status:'Pendiente'}]}; if(t==='Inmobiliaria') return {...base,leads:[{id:uid(),full_name:'Carlos Hernández',phone:'+52 639 100 2002',email:'carlos@example.com',status:'Nuevo'}],properties:[{id:uid(),name:'Depto Centro',location:'Delicias',price:'2800000',status:'Disponible'}],visits:[{id:uid(),property_id:'',title:'Visita propiedad',date:new Date().toISOString().slice(0,10)+' 12:00',status:'Confirmada'}],offers:[{id:uid(),property_id:'',offer_value:'2500000',status:'Enviada'}],payments:[{id:uid(),contact_id:'',concept:'Apartado',amount:'25000',status:'Pendiente'}],opportunities:[{id:uid(),contact_id:'',name:'Venta Depto Centro',stage:'Negociación',probability:'70%',value:'2800000'}]}; if(t==='Ventas') return {...base,leads:[{id:uid(),full_name:'Laura Gómez',phone:'+52 639 100 2003',email:'laura@example.com',status:'Nuevo'}],pipeline:[{id:uid(),lead_id:'',stage:'Negociación',value:'32000',probability:'60%'}],quotes:[{id:uid(),lead_id:'',title:'Cotización inicial',amount:'32000',status:'Borrador'}],payments:[{id:uid(),lead_id:'',concept:'Cobro venta',amount:'12000',status:'Pendiente'}],activities:[{id:uid(),lead_id:'',type:'Llamada',date:new Date().toISOString().slice(0,10)+' 15:00',status:'Pendiente'}]}; return {...base,contacts:[{id:uid(),full_name:'María López',phone:'+52 639 100 2001',email:'maria@example.com',status:'Activa'}],services:[{id:uid(),name:'Servicio programado',frequency:'Mensual',status:'Activo'}],schedules:[{id:uid(),contact_id:'',title:'Servicio programado',date:new Date().toISOString().slice(0,10)+' 09:30',status:'Confirmada'}],documents:[{id:uid(),record_id:'',file_name:'OrdenServicio.pdf',file_type:'PDF'}],payments:[{id:uid(),contact_id:'',concept:'Mensualidad',amount:'3000',status:'Pagado'}],tickets:[{id:uid(),contact_id:'',title:'Soporte inicial',status:'Abierto'}]}; }
const el=id=>document.getElementById(id); const q=()=>el('quickSearch').value.trim().toLowerCase();
function login(){state.user={email:el('loginEmail').value,type:el('loginType').value};state.tenant=el('loginType').value;el('loginView').classList.add('hidden');el('app').classList.remove('hidden');el('tenantType').value=state.tenant;toast('Acceso correcto',`Sesión iniciada como ${state.tenant}`);render();}
function switchTenant(){state.tenant=el('tenantType').value;state.page='Dashboard';render()}
function setPage(p){state.page=p;render()}
function renderNav(){const nav=el('nav');nav.innerHTML='';BASE[state.tenant].forEach(m=>{const b=document.createElement('button');b.textContent=m;b.className=m===state.page?'active':'';b.onclick=()=>setPage(m);nav.appendChild(b);});}
function data(){return store[state.tenant]} function currentEntity(){const pg=state.page; if(['Pacientes','Clientes','Leads'].includes(pg)) return state.tenant==='Inmobiliaria'?'leads':'contacts'; if(['Citas','Agenda','Reuniones','Visitas'].includes(pg)) return state.tenant==='Médico'?'appointments':state.tenant==='Consultoría'?'meetings':state.tenant==='Despacho'?'hearings':state.tenant==='Inmobiliaria'?'visits':'schedules'; if(pg==='Expedientes') return 'cases'; if(pg==='Documentos') return 'documents'; if(pg==='Cobros' || pg==='Honorarios') return 'payments'; if(pg==='Pipeline' || pg==='Oportunidades') return state.tenant==='Ventas'?'pipeline':'opportunities'; if(pg==='Proyectos') return 'projects'; if(pg==='Entregables') return 'deliverables'; if(pg==='Servicios') return 'services'; return 'contacts'}
function entityList(){return data()[currentEntity()]||[]} function filterArr(arr){const term=q(); if(!term) return arr; return (arr||[]).filter(o=>Object.values(o).join(' ').toLowerCase().includes(term))}
function metrics(){const d=data(); const total=Object.values(d).reduce((a,x)=>a+(Array.isArray(x)?x.length:0),0); const events=d.events||[]; const today=new Date().toISOString().slice(0,10); const week=7*86400000; const month=30*86400000; const nowt=Date.now(); const dates=events.map(e=>new Date(e.date).getTime()).filter(x=>!isNaN(x)); return {total,day:events.filter(e=>e.date===today).length,week:dates.filter(x=>x>=nowt-week&&x<=nowt+week).length,month:dates.filter(x=>x>=nowt-month&&x<=nowt+month).length} }
function render(){if(el('app').classList.contains('hidden')) return; const d=data(); el('tenantLabel').textContent=`Modo: ${state.tenant}`; el('pageTitle').textContent=state.page; el('pageSub').textContent=`${state.tenant} · conexión real preparada`; renderNav(); const v=el('view'); v.innerHTML=''; const m=metrics(); [['Registros',m.total,'Datos del tenant','info'],['Hoy',m.day,'Eventos del día','ok'],['Semana',m.week,'Eventos próximos 7 días','warn'],['Mes',m.month,'Eventos próximos 30 días','danger']].forEach(s=>v.insertAdjacentHTML('beforeend',`<div class="card kpi"><div class="label">${s[0]}</div><div class="value">${s[1]}</div><div class="hint">${s[2]}</div><div><span class="badge ${s[3]}">${s[0]} activo</span></div></div>`)); if(state.page==='Dashboard') v.insertAdjacentHTML('beforeend', dashboardView(d,m)); else if(['Pacientes','Clientes','Leads'].includes(state.page)) v.insertAdjacentHTML('beforeend', entityView()); else if(['Citas','Agenda','Reuniones','Visitas'].includes(state.page)) v.insertAdjacentHTML('beforeend', appointmentView()); else if(state.page==='Expedientes') v.insertAdjacentHTML('beforeend', caseView()); else if(state.page==='Pipeline' || state.page==='Oportunidades') v.insertAdjacentHTML('beforeend', pipelineView()); else if(state.page==='Cobros' || state.page==='Honorarios') v.insertAdjacentHTML('beforeend', paymentsView()); else if(state.page==='Documentos') v.insertAdjacentHTML('beforeend', documentsView()); else if(state.page==='Reportes') v.insertAdjacentHTML('beforeend', reportsView(m)); else if(state.page==='Automatizaciones') v.insertAdjacentHTML('beforeend', automationsView()); else if(['Servicios','Proyectos','Entregables'].includes(state.page)) v.insertAdjacentHTML('beforeend', workView()); else v.insertAdjacentHTML('beforeend', genericView()); }

odal('contact')">Nuevo registro</button><button class="btn light" onclick="openModal('appointment')">Nueva cita</button><button class="btn light" onclick="openModal('opportunity')">Nueva oportunidad</button></div><div style="height:12px"></div><div class="chips">${BASE[state.tenant].map(m=>`<span class="chip">${m}</span>`).join('')}</div></div><div class="card half"><div class="section-head"><h3>Alertas</h3><div class="meta">Diarias, semanales y mensuales</div></div>${d.events.map(e=>`<div class="task"><b>${e.title}</b><div class="small">${e.date} · ${e.status}</div></div>`).join('')}</div><div class="card panel"><div class="section-head"><h3>Registro activo</h3><div class="meta">CRUD + persistencia + sync</div></div><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Estado</th><th>Detalle</th><th>Acciones</th></tr></thead><tbody>${filterArr(entityList()).slice(0,10).map(r=>`<tr><td>${r.full_name||r.name||r.title||r.case_number||r.file_name||r.concept}</td><td>${r.status||r.state||r.stage||'N/A'}</td><td>${r.phone||r.email||r.date||r.amount||''}</td><td><button class="btn light" onclick="openEdit('${currentEntity()}','${r.id}')">Editar</button> <button class="btn light" onclick="removeRecord('${currentEntity()}','${r.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function calendarDays(){const nowD=new Date(); const days=[]; for(let i=0;i<14;i++){const dt=new Date(nowD.getTime()+i*86400000); const iso=dt.toISOString().slice(0,10); const ev=(data().events||[]).find(e=>e.date===iso); days.push(`<div class="day ${i===0?'today':''}"><div class="d">${dstr(dt)}</div><div class="n">${ev?ev.title:'Libre'}</div><div class="toolbar" style="margin-top:8px"><button class="btn light" onclick="editEvent('${iso}')">Editar</button></div></div>`)} return days.join('')}
function editEvent(date){const ev=(data().events||[]).find(e=>e.date===date); openModal('event', ev?.id||'')}
function addQuickEvent(range){const d=data(); d.events=d.events||[]; const title=range==='Hoy'?'Aviso del día':range==='Semana'?'Revisión semanal':'Plan mensual'; const date=range==='Hoy'?new Date().toISOString().slice(0,10):range==='Semana'?new Date(Date.now()+2*86400000).toISOString().slice(0,10):new Date(Date.now()+10*86400000).toISOString().slice(0,10); d.events.push({id:uid(),title,date,status:range}); d.logs.push({id:uid(),type:'create',entity:'events',label:`Evento ${range.toLowerCase()} creado`,date:now()}); saveStore(); render(); toast('Calendario',`Evento agregado para ${range}`)}

function saveRecord(type,id){const obj={}; [...el('modalForm').querySelectorAll('[data-field]')].forEach(i=>obj[i.dataset.field]=i.value); const d=store[state.tenant]; const target=type==='event'?'events':currentEntity(); const list=d[target]||(d[target]=[]); if(id){const idx=list.findIndex(x=>x.id===id); if(idx>=0) list[idx]={...list[idx],...obj}; d.logs.push({id:uid(),type:'update',entity:target,label:`${target} actualizado`,date:now()})} else {list.push({id:uid(),...obj}); d.logs.push({id:uid(),type:'create',entity:target,label:`${target} creado`,date:now()})} saveStore(); render(); hideModal(); toast('Guardado',id?'Registro actualizado':'Registro creado')}

function pipelineView(){return `<div class="card panel"><div class="section-head"><h3>Pipeline</h3><div class="meta">Persistente por tenant</div></div><div class="toolbar" style="margin-bottom:12px"><button class="btn primary" onclick="openModal('${currentEntity()}')">Nuevo</button><button class="btn light" onclick="openDrawer('mapping')">Columnas Sheets</button></div><div class="kanban"><div class="col"><h4>Nuevo</h4><div class="task"><b>Lead inbound</b><div class="small">Origen web / WhatsApp</div></div></div><div class="col"><h4>Contactado</h4><div class="task"><b>Seguimiento</b><div class="small">Llamada / correo</div></div></div><div class="col"><h4>Negociación</h4>${filterArr(entityList()).map(o=>`<div class="task"><b>${o.name||o.title||o.stage}</b><div class="small">$${o.value||o.amount||''} · ${o.stage||o.status||o.probability||''}</div><div class="toolbar" style="margin-top:10px"><button class="btn light" onclick="openEdit('${currentEntity()}','${o.id}')">Editar</button><button class="btn light" onclick="removeRecord('${currentEntity()}','${o.id}')">Eliminar</button></div></div>`).join('')}</div><div class="col"><h4>Cerrado</h4><div class="task"><b>Finalizado</b><div class="small">Pago o cierre del caso</div></div></div></div></div>`}
function documentsView(){return `<div class="card panel"><div class="section-head"><h3>Documentos</h3><div class="meta">Subir, editar, eliminar</div></div><div class="toolbar" style="margin-bottom:12px"><button class="btn primary" onclick="openModal('documents')">Nuevo documento</button><button class="btn light" onclick="openDrawer('mapping')">Columnas Sheets</button></div><div class="tablewrap"><table><thead><tr><th>Archivo</th><th>Tipo</th><th>Ligado a</th><th>Acciones</th></tr></thead><tbody>${filterArr(entityList()).map(x=>`<tr><td>${x.file_name||x.name}</td><td>${x.file_type||x.type}</td><td>${x.linked||''}</td><td><button class="btn light" onclick="openEdit('documents','${x.id}')">Editar</button> <button class="btn light" onclick="removeRecord('documents','${x.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function paymentsView(){return `<div class="card panel"><div class="section-head"><h3>Cobros / Honorarios</h3><div class="meta">Persistente y editable</div></div><div class="toolbar" style="margin-bottom:12px"><button class="btn primary" onclick="openModal('payments')">Nuevo cobro</button><button class="btn light" onclick="openDrawer('mapping')">Columnas Sheets</button></div><div class="tablewrap"><table><thead><tr><th>Concepto</th><th>Monto</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${filterArr(entityList()).map(p=>`<tr><td>${p.concept}</td><td>$${p.amount}</td><td><span class="badge ${p.status==='Pagado'?'ok':'warn'}">${p.status}</span></td><td><button class="btn light" onclick="openEdit('payments','${p.id}')">Editar</button> <button class="btn light" onclick="removeRecord('payments','${p.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function reportsView(m){return `<div class="card panel"><div class="section-head"><h3>Reportes</h3><div class="meta">KPIs y alertas</div></div><div class="grid" style="grid-template-columns:repeat(12,1fr)"><div class="card third"><div class="label">Conversión</div><div class="value">32%</div><div class="hint">Leads a oportunidades</div></div><div class="card third"><div class="label">Cobranza</div><div class="value">86%</div><div class="hint">Pagado vs pendiente</div></div><div class="card third"><div class="label">Agenda</div><div class="value">91%</div><div class="hint">Citas cumplidas</div></div></div><div style="height:12px"></div><div class="task"><b>Alertas del periodo</b><div class="small">Hoy: ${m.day} · Semana: ${m.week} · Mes: ${m.month}</div></div></div>`}
function automationsView(){return `<div class="card panel"><div class="section-head"><h3>Automatizaciones</h3><div class="meta">Reglas simuladas</div></div><div class="task"><b>Alta automática</b><div class="small">Crea tareas al detectar nuevos registros.</div></div><div class="task"><b>Recordatorio</b><div class="small">Envía avisos por evento de calendario.</div></div><div class="task"><b>Seguimiento</b><div class="small">Dispara avisos por día, semana y mes.</div></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="runSync()">Probar sync bidireccional</button><button class="btn light" onclick="openDrawer('mapping')">Ver mapping Sheets</button></div></div>`}
function workView(){return `<div class="card panel"><div class="section-head"><h3>${state.page}</h3><div class="meta">Gestión profesional del servicio</div></div><div class="task"><b>Planificación</b><div class="small">Fases, entregables, responsables y tiempo estimado.</div></div><div class="task"><b>Seguimiento</b><div class="small">Avance, bloqueos, aprobación y resultados.</div></div><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="openModal('notes')">Agregar nota</button><button class="btn light" onclick="openModal('documents')">Adjuntar evidencia</button></div></div>`}
function genericView(){return `<div class="card panel"><h3>Módulo activo</h3><p class="muted">Vista funcional cargada para ${state.page}.</p></div>`}
function hideDrawer(){el('drawer').classList.remove('open');el('drawerBackdrop').style.display='none'} function closeDrawer(e){if(e.target===el('drawerBackdrop'))hideDrawer()}
function openModal(type, editId=''){const fields=type==='appointment'?['title','start_at','status']:type==='contact'?['full_name','phone','email','status']:type==='opportunity'?['name','stage','probability','value']:type==='event'?['title','date','status']:['name','status']; el('modalTitle').textContent=editId?`Editar ${type}`:`Nuevo ${type}`; const form=el('modalForm'); form.innerHTML=''; const current=editId?findRecord(editId):{}; fields.forEach(f=>form.insertAdjacentHTML('beforeend',`<div class="field"><label>${f}</label><input data-field="${f}" value="${current[f]||''}" /></div>`)); form.insertAdjacentHTML('beforeend',`<div class="full footer-actions"><button type="button" class="btn light" onclick="hideModal()">Cancelar</button><button type="button" class="btn primary" onclick="saveRecord('${type}','${editId}')">Guardar</button></div>`); el('modalBackdrop').style.display='flex';}
function findRecord(id){return Object.values(data()).flat().find(x=>x&&x.id===id)||{}}
function saveRecord(type,id){const obj={}; [...el('modalForm').querySelectorAll('[data-field]')].forEach(i=>obj[i.dataset.field]=i.value); const d=store[state.tenant]; const target=type==='event'?'events':currentEntity(); const list=d[target]||(d[target]=[]); if(id){const idx=list.findIndex(x=>x.id===id); if(idx>=0) list[idx]={...list[idx],...obj}; d.logs.push({id:uid(),type:'update',entity:target,label:`${target} actualizado`,date:now()})} else {list.push({id:uid(),...obj}); d.logs.push({id:uid(),type:'create',entity:target,label:`${target} creado`,date:now()})} saveStore(); render(); hideModal(); toast('Guardado',id?'Registro actualizado':'Registro creado')}
function openEdit(type,id){openModal(type,id)} function removeRecord(type,id){const d=store[state.tenant]; const target=type==='event'?'events':currentEntity(); const list=d[target]||(d[target]=[]); const idx=list.findIndex(x=>x.id===id); if(idx>=0){list.splice(idx,1); d.logs.push({id:uid(),type:'delete',entity:target,label:`${target} eliminado`,date:now()}); saveStore(); render(); toast('Eliminado','Registro borrado')}}
function appointmentView(){return `<div class="card panel"><div class="section-head"><h3>${state.page}</h3><div class="meta">Agenda persistente</div></div><div class="toolbar" style="margin-bottom:12px"><button class="btn primary" onclick="openModal('${currentEntity()}')">Nuevo registro</button><button class="btn light" onclick="openDrawer('mapping')">Columnas Sheets</button></div>${filterArr(entityList()).map(a=>`<div class="task"><b>${a.title||a.name||'Evento'}</b><div class="small">${a.start_at||a.date||''} · ${a.status||''}</div><div class="toolbar" style="margin-top:10px"><button class="btn light" onclick="openEdit('${currentEntity()}','${a.id}')">Editar</button><button class="btn light" onclick="removeRecord('${currentEntity()}','${a.id}')">Eliminar</button></div></div>`).join('')}</div>`}
function calendarDays(){const nowD=new Date(); const days=[]; for(let i=0;i<14;i++){const dt=new Date(nowD.getTime()+i*86400000); const iso=dt.toISOString().slice(0,10); const ev=(data().events||[]).find(e=>e.date===iso); days.push(`<div class="day ${i===0?'today':''}"><div class="d">${dstr(dt)}</div><div class="n">${ev?ev.title:'Libre'}</div><div class="toolbar" style="margin-top:8px"><button class="btn light" onclick="editEvent('${iso}')">Editar</button></div></div>`)} return days.join('')}
function addQuickEvent(range){const d=data(); d.events=d.events||[]; const title=range==='Hoy'?'Aviso del día':range==='Semana'?'Revisión semanal':'Plan mensual'; const date=range==='Hoy'?new Date().toISOString().slice(0,10):range==='Semana'?new Date(Date.now()+2*86400000).toISOString().slice(0,10):new Date(Date.now()+10*86400000).toISOString().slice(0,10); d.events.push({id:uid(),title,date,status:range}); d.logs.push({id:uid(),type:'create',entity:'events',label:`Evento ${range.toLowerCase()} creado`,date:now()}); saveStore(); render(); toast('Calendario',`Evento agregado para ${range}`)}
function editEvent(date){const ev=(data().events||[]).find(e=>e.date===date); openModal('event', ev?.id||'')}
function runPush(){const d=data(); if(!d.scriptUrl) return toast('Config', 'Primero guarda la URL de la Web App'); const payload={action:'push',tenant:state.tenant,token:d.sharedToken||'',rows:sheetPayload()}; fetch(d.scriptUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json()).then(j=>{d.syncStatus='Push OK'; saveStore(); render(); toast('Push',`Sincronizado con Sheets`) }).catch(()=>toast('Push','No se pudo sincronizar'))}
function runPull(){const d=data(); if(!d.scriptUrl) return toast('Config', 'Primero guarda la URL de la Web App'); fetch(`${d.scriptUrl}?action=pull&tenant=${encodeURIComponent(state.tenant)}&token=${encodeURIComponent(d.sharedToken||'')}`).then(r=>r.json()).then(j=>{d.syncStatus='Pull OK'; saveStore(); render(); toast('Pull','Datos leídos desde Sheets')}).catch(()=>toast('Pull','No se pudo leer desde Sheets'))}
function runSync(){runPush(); setTimeout(runPull,700)}
function sheetPayload(){const d=data(); const e=currentEntity(); const rows=(d[e]||[]).map(r=>Object.values(r)); return {[e]:rows}}
function saveSyncConfig(){const d=data(); d.scriptUrl=DEFAULT_SCRIPT_URL; d.syncStatus='Configurado para Web App'; saveStore(); toast('Configuración','URL guardada'); render()}
function runHealthCheck(){const d=data(); if(!d.scriptUrl) return toast('Config', 'Primero guarda la URL de la Web App'); fetch(`${d.scriptUrl}?action=health`).then(r=>r.json()).then(j=>{d.syncStatus=j.ok?'Web App OK':'Error Web App'; saveStore(); render(); toast('Health', j.ok?'Web App respondió correctamente':'Respuesta inválida')}).catch(()=>toast('Health','No respondió la Web App'))}
const APPS_SCRIPT_BASE=`function doGet(e){
  const action=(e.parameter.action||'health');
  const tenant=e.parameter.tenant||'';
  if(action==='health') return json({ok:true, ts:new Date().toISOString()});
  if(action==='schema') return json({tenant:tenant, schema:SCHEMA[tenant]||{}});
  if(action==='pull') return json({tenant:tenant, rows:getRows(tenant)});
  return json({ok:false, error:'unsupported'});
}
function doPost(e){
  const body=JSON.parse(e.postData.contents||'{}');
  const action=body.action||'push';
  if(action==='push') return json({ok:true, rows:pushRows(body)});
  return json({ok:false, error:'unsupported'});
}
const SHEET_ID='PASTE_SPREADSHEET_ID';
const TOKEN='PASTE_SHARED_TOKEN';
const SCHEMA=${JSON.stringify(SCHEMAS,null,2)};
function ss(){return SpreadsheetApp.openById(SHEET_ID)}
function json(obj){return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON)}
function verifyToken(t){return !TOKEN||t===TOKEN}
function sheetByName(name){return ss().getSheetByName(name)}
function getRows(tenant){ const cfg=SCHEMA[tenant]||{}; const out={}; Object.keys(cfg).forEach(k=>{const sh=sheetByName(k); if(!sh) return; out[k]=sh.getDataRange().getValues();}); return out; }
function pushRows(body){ const tenant=body.tenant; if(!verifyToken(body.token)) throw new Error('invalid token'); const rows=body.rows||{}; Object.keys(rows).forEach(name=>{ let sh=sheetByName(name); if(!sh) sh=ss().insertSheet(name); const data=rows[name]; if(!data||!data.length) return; sh.clearContents(); sh.getRange(1,1,data.length,data[0].length).setValues(data); }); return getRows(tenant); }`;
function openDrawer(type){const d=el('drawer'),b=el('drawerBackdrop');b.style.display='block';d.classList.add('open'); const s=data(); if(type==='setup'){el('drawerTitle').textContent='Setup Apps Script'; el('drawerSub').textContent='Paso final'; el('drawerBody').innerHTML=`<div class='box'><h4>1. Pega la URL</h4><p>${DEFAULT_SCRIPT_URL}</p></div><div class='box'><h4>2. Sheet ID</h4><p>Guarda el ID de tu Spreadsheet en la configuración interna.</p></div><div class='box'><h4>3. Token</h4><p>Puede quedar vacío por ahora. Si después quieres proteger la Web App, pon un token sencillo y úsalo en frontend y script.</p></div><div class='box'><h4>4. Prueba</h4><p>Usa el botón de health, push y pull.</p></div>`}
 else if(type==='mapping'){el('drawerTitle').textContent='Mapeo de Sheets'; el('drawerSub').textContent=`${state.tenant} · columnas por hoja`; el('drawerBody').innerHTML=`<div class='box'><h4>Hojas</h4><p>${Object.keys(SCHEMAS[state.tenant]).join(', ')}</p></div><div class='box'><h4>Columnas</h4>${Object.entries(SCHEMAS[state.tenant]).map(([k,v])=>`<div style='margin-bottom:10px'><b>${k}</b><div class='small'>${v.join(', ')}</div></div>`).join('')}</div>`}
 else if(type==='sync'){el('drawerTitle').textContent='Sincronización'; el('drawerSub').textContent='LocalStorage ↔ Google Sheets'; el('drawerBody').innerHTML=`<div class='box'><h4>Configuración</h4><p><b>URL:</b> ${s.scriptUrl||DEFAULT_SCRIPT_URL}<br><b>Sheet ID:</b> ${s.sheetId||'No definido'}<br><b>Token:</b> ${s.sharedToken||'Vacío'}</p></div><div class='box'><h4>Guardar rápido</h4><div class='form-grid'><div class='field full'><label>Web App URL</label><input id='cfgUrl' value='${s.scriptUrl||DEFAULT_SCRIPT_URL}' /></div><div class='field'><label>Sheet ID</label><input id='cfgSheet' value='${s.sheetId||''}' /></div><div class='field'><label>Token</label><input id='cfgToken' value='${s.sharedToken||''}' /></div></div></div><div class='box'><h4>Acciones</h4><div class='toolbar'><button class='btn primary' onclick="saveRemoteConfig()">Guardar config</button><button class='btn light' onclick="runHealthCheck()">Health</button><button class='btn light' onclick="runSync()">Sync completo</button></div></div><div class='box'><h4>Estado</h4><p id='syncState'>${s.syncStatus||'Sin configurar'}</p></div>`}
 else if(type==='script'){el('drawerTitle').textContent='Apps Script base'; el('drawerSub').textContent='Listo para pegar'; el('drawerBody').innerHTML=`<div class='box'><h4>Código base</h4><div class='code'>${APPS_SCRIPT_BASE.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div></div><div class='box'><h4>Importante</h4><p>Solo cambia <b>SHEET_ID</b> y, si quieres, <b>TOKEN</b>. Si el token queda vacío, el frontend también funciona en modo abierto.</p></div>`}
}
function saveRemoteConfig(){const d=data(); d.scriptUrl=(el('cfgUrl').value||DEFAULT_SCRIPT_URL).trim(); d.sheetId=(el('cfgSheet').value||'').trim(); d.sharedToken=(el('cfgToken').value||'').trim(); d.syncStatus='Configuración guardada'; saveStore(); render(); toast('Configuración','Guardada correctamente')}
function hideDrawer(){el('drawer').classList.remove('open');el('drawerBackdrop').style.display='none'} function closeDrawer(e){if(e.target===el('drawerBackdrop'))hideDrawer()}
function hideModal(){el('modalBackdrop').style.display='none'} function closeModal(e){if(e.target===el('modalBackdrop'))hideModal()}
function toast(title,message){const t=document.createElement('div');t.className='toast';t.innerHTML=`<b>${title}</b><span>${message}</span>`;el('toasts').appendChild(t);setTimeout(()=>t.remove(),3400)}
render();
</script>
